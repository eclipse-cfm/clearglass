[package]
name = "clearglass"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clearglass"
path = "src/main.rs"

[dependencies]
pingora-core = "0.8"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10"

[dev-dependencies]
wiremock = "0.6"
ed25519-dalek = { version = "3", features = ["pkcs8"] }
base64 = "0.22"
